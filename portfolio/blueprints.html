<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Prints | S J</title>
  <link rel="icon" href="../assets/images/cropped-Bildschirmfoto-2023-03-02-um-16.43.00-32x32.png" sizes="32x32">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header scrolled">
    <div class="header-inner">
      <div class="logo"><a href="../index.html"><img src="../assets/images/Logo-SJ-Homepage-fett.png" alt="SJ Logo"></a></div>
      <nav class="main-nav">
        <button class="menu-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
        <ul><li><a href="../portfolio.html" class="active">Portfolio</a></li><li><a href="../about.html">About</a></li></ul>
      </nav>
    </div>
  </header>

  <section class="portfolio-subpage">
    <div class="container-wide">
      <h1 class="page-title">Blue Prints</h1>

      <div class="photo-gallery cols-3">
        <img src="../assets/images/blueprints/Detail3.jpg" alt="Blueprint" loading="lazy" onclick="openLightbox(this)">
        <img src="../assets/images/blueprints/Pers2.png" alt="Blueprint" loading="lazy" onclick="openLightbox(this)">
        <img src="../assets/images/blueprints/Pers1-1.png" alt="Blueprint" loading="lazy" onclick="openLightbox(this)">
        <img src="../assets/images/blueprints/Detail1-1.png" alt="Blueprint" loading="lazy" onclick="openLightbox(this)">
        <img src="../assets/images/blueprints/Pers5.jpg" alt="Blueprint" loading="lazy" onclick="openLightbox(this)">
        <img src="../assets/images/blueprints/Detail2-1.png" alt="Blueprint" loading="lazy" onclick="openLightbox(this)">
        <img src="../assets/images/blueprints/Pers3.png" alt="Blueprint" loading="lazy" onclick="openLightbox(this)">
        <img src="../assets/images/blueprints/Pers4.png" alt="Blueprint" loading="lazy" onclick="openLightbox(this)">
      </div>
    </div>
  </section>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="close-btn">&times;</span>
    <img id="lightboxImg" src="" alt="">
  </div>

  <footer class="site-footer"><div class="container"><p>-- Shayna Jucker | <a href="mailto:jucker.shayna@gmail.com">jucker.shayna@gmail.com</a> --</p></div></footer>
  <script src="../js/main.js"></script>
  <script>
    function openLightbox(el) { document.getElementById('lightbox').classList.add('active'); document.getElementById('lightboxImg').src = el.src; }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
  </script>
</body>
</html>
