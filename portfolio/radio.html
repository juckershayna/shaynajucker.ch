  <style>
    .radio-page {
      background-color: #2b2b2b;
      padding: 180px 0 0;
      position: relative;
      z-index: 1;
    }

    .radio-title {
      font-size: 85px;
      font-weight: 800;
      color: #555555;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 80px;
    }

    .radio-heading {
      font-size: 30px;
      font-weight: 800;
      color: #957b5f;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }

    .radio-image {
      width: 100%;
      display: block;
      margin-bottom: 0;
    }

    /* Container for text + image rows (960px max) */
    .radio-content-row {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 30px;
      margin-bottom: 30px;
    }

    /* Fullwidth audio rows (no max-width, edge to edge within gutters1) */
    .audio-row-full {
      display: grid;
      gap: 0;
      width: 100%;
      margin-bottom: 80px;
    }
    .audio-row-full.cols-5 { grid-template-columns: repeat(5, 1fr); }
    .audio-row-full.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .audio-row-full.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .audio-row-full.cols-1 { grid-template-columns: 1fr; }

    /* Divi-style audio module: copper background, white text */
    .divi-audio {
      background-color: #957b5f;
      padding: 30px 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100px;
    }

    .divi-audio h3 {
      font-size: 25px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      line-height: 1.2;
    }

    .divi-audio audio {
      width: 100%;
      height: 36px;
    }

    /* Custom audio player styling to match copper theme */
    .divi-audio audio::-webkit-media-controls-panel {
      background-color: rgba(0,0,0,0.15);
      border-radius: 0;
    }
    .divi-audio audio::-webkit-media-controls-play-button {
      filter: brightness(2);
    }
    .divi-audio audio::-webkit-media-controls-current-time-display,
    .divi-audio audio::-webkit-media-controls-time-remaining-display {
      color: #fff;
    }

    @media (max-width: 980px) {
      .radio-title { font-size: 60px; }
      .audio-row-full.cols-5 { grid-template-columns: repeat(3, 1fr); }
      .divi-audio h3 { font-size: 20px; }
      .divi-audio { padding: 20px; }
    }
    @media (max-width: 767px) {
      .radio-page { padding: 140px 0 0; }
      .radio-title { font-size: 25px; letter-spacing: 2px; }
      .radio-heading { font-size: 22px; }
      .audio-row-full.cols-5,
      .audio-row-full.cols-3,
      .audio-row-full.cols-2 { grid-template-columns: 1fr; }
      .divi-audio h3 { font-size: 18px; }
    }
  </style>
</head>
